apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}
  namespace: {{ include "valkey.namespace" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
data:
  valkey.conf: |
    {{- .Values.server.config | nindent 4 }}
    {{- with .Values.server.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
