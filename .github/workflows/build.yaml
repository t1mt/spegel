name: build
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
defaults:
  run:
    shell: bash
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
      - name: Setup Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 #v4.1.0
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 #v6.3.0
        with:
          go-version-file: go.mod
      - name: Build binaries
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 #v7.0.0
        with:
          args: build --snapshot --clean --skip before
      - name: Verify image binaries
        run: |
          test -x dist/spegel_linux_amd64/spegel
          test -x dist/spegel_linux_arm64/spegel
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 #v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tag
        id: prep
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/spegel
          IMAGE_TAG=$(git describe --tags --always)
          IMAGE_REF=${IMAGE_NAME}:${IMAGE_TAG}
          IMAGE_REF_ARM64=${IMAGE_REF}-arm64
          IMAGE_REF_AMD64=${IMAGE_REF}-amd64
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF_ARM64=${IMAGE_REF_ARM64}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF_AMD64=${IMAGE_REF_AMD64}" >> "$GITHUB_OUTPUT"
      - name: Build multi-arch image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 #v7.0.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.prep.outputs.IMAGE_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build arm64 image
        id: build-arm64
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 #v7.0.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.prep.outputs.IMAGE_REF_ARM64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image
        id: build-amd64
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 #v7.0.0
        with:
          push: ${{ github.event_name != 'pull_request' }}
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.prep.outputs.IMAGE_REF_AMD64 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign images with Cosign
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes ${{ steps.prep.outputs.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          cosign sign --yes ${{ steps.prep.outputs.IMAGE_NAME }}@${{ steps.build-arm64.outputs.digest }}
          cosign sign --yes ${{ steps.prep.outputs.IMAGE_NAME }}@${{ steps.build-amd64.outputs.digest }}
